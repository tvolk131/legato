[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/tvolk131/legato"
publish = false

[workspace.dependencies]
legato-proto = { path = "crates/legato-proto" }
legato-core = { path = "crates/legato-core" }

keycode = "1.0.0"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tracing = "0.1.44"

insta = "1.48.0"
proptest = "1.11.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
