[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/tvolk131/legato"
publish = false

[workspace.dependencies]
legato-proto = { path = "crates/legato-proto" }
legato-core = { path = "crates/legato-core" }
legato-net = { path = "crates/legato-net" }
legato-macos = { path = "crates/legato-macos" }

anyhow = "1.0.104"
bytes = "1.12.1"
directories = "6.0.0"
iroh = "1.2"
iroh-mdns-address-lookup = "0.5"
keycode = "1.0.0"
n0-future = "0.3.2"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
tracing = "0.1.44"
whoami = "2.1.3"

insta = "1.48.0"
proptest = "1.11.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
