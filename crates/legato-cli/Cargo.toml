[package]
name = "legato-cli"
description = "The legato command: pair machines and share one keyboard and mouse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "legato"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
legato-core.workspace = true
legato-net.workspace = true
legato-proto.workspace = true
n0-future.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["signal", "io-std"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
legato-macos.workspace = true

[target.'cfg(windows)'.dependencies]
legato-windows.workspace = true

[lints]
workspace = true
