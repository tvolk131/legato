[package]
name = "legato-screen"
description = "Legato virtual monitor mode: a virtual display on macOS, streamed as H.264 to a viewer on Windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.4"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-foundation = "0.3.2"
objc2-screen-capture-kit = "0.3.2"
objc2-video-toolbox = "0.3.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
] }

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
legato-macos.workspace = true
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-video = "0.3.2"
