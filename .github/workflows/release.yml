# Publishes a GitHub prerelease with downloadable binaries when a version tag is pushed,
# e.g. `git tag v0.1.0-alpha.1 && git push origin v0.1.0-alpha.1`. Release notes come from
# docs/releases/<tag>.md if it exists.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: build
        shell: bash
        run: |
          cargo build --locked --release -p legato-cli --target ${{ matrix.target }}
          # The app arrived after the first alpha; build it when the tag has it.
          if [ -d crates/legato-app ]; then
            cargo build --locked --release -p legato-app --target ${{ matrix.target }}
          fi
      - name: package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "legato-$env:TAG-${{ matrix.name }}"
          New-Item -ItemType Directory $dir | Out-Null
          $out = "target/${{ matrix.target }}/release"
          if (Test-Path $out/legato-app.exe) {
            # Windows file names ignore case, so the app (Legato.exe) and the CLI
            # (legato.exe) can't share a folder.
            Copy-Item $out/legato-app.exe $dir/Legato.exe
            New-Item -ItemType Directory $dir/cli | Out-Null
            Copy-Item $out/legato.exe $dir/cli/
          } else {
            Copy-Item $out/legato.exe $dir/
          }
          Copy-Item README.md, LICENSE $dir/
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
      - name: package (macOS)
        if: runner.os == 'macOS'
        run: |
          dir="legato-$TAG-${{ matrix.name }}"
          out="target/${{ matrix.target }}/release"
          mkdir "$dir"
          cp "$out/legato" README.md LICENSE "$dir/"
          if [ -f "$out/legato-app" ]; then
            app="$dir/Legato.app/Contents"
            mkdir -p "$app/MacOS"
            cp "$out/legato-app" "$app/MacOS/Legato"
            sed "s/__VERSION__/${TAG#v}/" packaging/macos/Info.plist > "$app/Info.plist"
            # Ad-hoc signature until there's a Developer ID.
            codesign --force --deep --sign - "$dir/Legato.app"
          fi
          tar czf "$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            legato-*.zip
            legato-*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: create or update the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$TAG.md"
          [ -f "$notes" ] || { echo "Build of $TAG." > /tmp/notes.md; notes=/tmp/notes.md; }
          assets=(dist/*.zip dist/*.tar.gz)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --prerelease --title "Legato $TAG" --notes-file "$notes"
          fi
