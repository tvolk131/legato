# Publishes a GitHub prerelease with downloadable binaries when a version tag is pushed,
# e.g. `git tag v0.1.0-alpha.1 && git push origin v0.1.0-alpha.1`. Release notes come from
# docs/releases/<tag>.md if it exists.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release -p legato-cli --target ${{ matrix.target }}
      - name: package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "legato-$env:TAG-${{ matrix.name }}"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/${{ matrix.target }}/release/legato.exe $dir/
          Copy-Item README.md, LICENSE $dir/
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
      - name: package (macOS)
        if: runner.os == 'macOS'
        run: |
          dir="legato-$TAG-${{ matrix.name }}"
          mkdir "$dir"
          cp target/${{ matrix.target }}/release/legato README.md LICENSE "$dir/"
          tar czf "$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: legato-*.*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: create or update the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$TAG.md"
          [ -f "$notes" ] || { echo "Build of $TAG." > /tmp/notes.md; notes=/tmp/notes.md; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --prerelease --title "Legato $TAG" --notes-file "$notes"
          fi
