name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Deterministic headless rendering for UI tests (no GPU on runners).
  ICED_TEST_BACKEND: tiny-skia

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets
      - run: cargo test --locked --workspace
      # A UI snapshot mismatch leaves the new rendering and a diff here.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ui-snapshots-${{ matrix.os }}
          path: target/snapshots
          if-no-files-found: ignore
      # Hosted runners have an interactive desktop, so the real input stack can be tested.
      # These move the runner's cursor, which is why they're opt-in locally.
      - name: hardware tests (Windows)
        if: runner.os == 'Windows'
        run: cargo test --locked -p legato-windows -- --ignored --test-threads=1 --nocapture
      # The app draws with DirectX 12 on Windows (for mailbox presentation). Runners have
      # no GPU, but DX12's software renderer (WARP) runs the same shaders and pipelines.
      - name: GPU rendering (Windows, DirectX 12)
        if: runner.os == 'Windows'
        env:
          ICED_TEST_BACKEND: wgpu
          WGPU_BACKEND: dx12
        run: cargo test --locked -p legato-app gpu_renders -- --ignored --nocapture
      - name: hardware tests (macOS)
        if: runner.os == 'macOS'
        run: cargo test --locked -p legato-macos -- --ignored --test-threads=1

  msrv:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.91
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --workspace
